name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # lets a tagged build attach the installer and the client mod to a GitHub release

jobs:
  windows:
    runs-on: windows-latest
    env:
      # The launcher looks for updates and the Vox Client mod in this repository's releases.
      VOX_UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Build the UI
        run: npm run build:web

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Vox-Launcher-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe

  client-mod:
    # The optional Vox Client mod (Fabric). Built separately so a problem here never blocks the installer.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build Vox Client
        working-directory: vox-client-mod
        run: gradle build --no-daemon

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Vox-Client-Mod
          path: vox-client-mod/build/libs/vox-client-*+mc*.jar
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vox-client-mod/build/libs/vox-client-*+mc*.jar
